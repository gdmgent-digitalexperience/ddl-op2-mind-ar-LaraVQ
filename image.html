<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDL OP 2 - Mind AR</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./scripts/app.js">
</head>
<body>
     <button class="switch-button" id="next-button">
      SWITCH
    </button>

    <a-scene 
    mindar-image="imageTargetSrc: ./assets/targetsmysterium.mind; maxTrack: 4; missTolerance: 10" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    device-orientation-permission-ui="enabled: false"
     vr-mode-ui="enabled: false" 
    >
        <a-assets>
            <a-asset-item id="ferris_wheel" src="./assets/3D/carnival_ferris_wheel.glb"></a-asset-item>
            <a-asset-item id="knife" src="./assets/3D/throwing_knife_black.glb"></a-asset-item>
            <a-asset-item id="redrose" src="./assets/3D/red_rose.glb"></a-asset-item>
            <a-asset-item id="geishamask" src="./assets/3D/geisha_mask.glb"></a-asset-item>
        </a-assets>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="./assets/3D/throwing_knife_black.glb" scale="0.025 0.025 0.025" position="0 -0.3 0" rotation="0 0 0"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
           <a-gltf-model src="./assets/3D/red_rose.glb" scale="0.25 0.25 0.25" position="0 -0.3 0" rotation="0 -45 0"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2">
             <a-gltf-model src="./assets/3D/carnival_ferris_wheel.glb" scale="0.025 0.025 0.025" position="0 -0.3 0" rotation="0 -45 0"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3">
             <a-gltf-model src="./assets/3D/geisha_mask.glb" scale="0.25 0.25 0.25" position="-0.3 0 0" rotation="0 180 0"></a-gltf-model>
        </a-entity>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>
</html>
